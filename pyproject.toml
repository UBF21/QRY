[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qry"
version = "0.2.0"
description = "Composable filtering primitives for FastAPI and SQLAlchemy 2.0."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Felipe Rafael Montenegro" }
]
keywords = ["fastapi", "filtering", "pydantic", "sqlalchemy", "pagination", "ordering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.110,<1",
  "pydantic>=2,<3",
]
sqlalchemy = [
  "sqlalchemy>=2,<3",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.4,<1",
]
all = [
  "qry[fastapi,sqlalchemy]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"


[tool.setuptools.package-data]
qry = ["py.typed"]
